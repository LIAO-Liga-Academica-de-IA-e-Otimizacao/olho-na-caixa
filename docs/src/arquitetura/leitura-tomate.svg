<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" font-family="sans-serif">
  <rect width="920" height="260" fill="#f7f4ef"/>
  <text x="460" y="32" text-anchor="middle" font-size="20" fill="#1c1917">Tomate: das duas fotos até os litros</text>
  <rect x="28" y="68" width="150" height="78" rx="8" fill="#fff" stroke="#44403c"/>
  <text x="103" y="100" text-anchor="middle" font-size="14" fill="#1c1917">Duas fotos</text>
  <text x="103" y="122" text-anchor="middle" font-size="13" fill="#57534e">do arco</text>
  <rect x="218" y="68" width="190" height="78" rx="8" fill="#fff" stroke="#44403c"/>
  <text x="313" y="98" text-anchor="middle" font-size="14" fill="#1c1917">Tira a borda</text>
  <text x="313" y="120" text-anchor="middle" font-size="13" fill="#57534e">e o pico falso</text>
  <rect x="448" y="68" width="160" height="78" rx="8" fill="#fff" stroke="#44403c"/>
  <text x="528" y="98" text-anchor="middle" font-size="14" fill="#1c1917">Mediana</text>
  <text x="528" y="120" text-anchor="middle" font-size="13" fill="#57534e">sem somar raio</text>
  <rect x="648" y="68" width="240" height="78" rx="8" fill="#ecfccb" stroke="#3f6212"/>
  <text x="768" y="98" text-anchor="middle" font-size="14" fill="#1c1917">Litros = base × altura</text>
  <text x="768" y="120" text-anchor="middle" font-size="13" fill="#3f6212">quilo = litros × kg/L do lote</text>
  <path d="M178 107 H218 M408 107 H448 M608 107 H648" stroke="#44403c" stroke-width="2" fill="none"/>
  <text x="460" y="190" text-anchor="middle" font-size="15" fill="#44403c">O quilo por litro não sai da foto. Alguém pesa o lote e digita o número.</text>
  <text x="460" y="216" text-anchor="middle" font-size="15" fill="#44403c">O simulador só confere os litros. Uma tampa de 9 cm erra fácil 10% se a altura sair 1 cm.</text>
  <text x="460" y="242" text-anchor="middle" font-size="15" fill="#9a3412">Esse caminho também está só em sim/detect/.</text>
</svg>
